<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Taska{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/icon.svg') }}"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <img src="{{ url_for('static', filename='images/icon.svg') }}" width="28" height="28" alt="Taska"/>
      Taska
    </a>
    {% if current_user.is_authenticated %}
    <div class="nav-right">
      <span class="nav-user">{{ current_user.name }}</span>
      <a href="{{ url_for('auth.logout') }}" class="btn-logout">Logout</a>
    </div>
    {% endif %}
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  {% if current_user.is_authenticated %}
  <script src="{{ url_for('static', filename='js/socket.js') }}"></script>
  {% endif %}
  {% block scripts %}{% endblock %}
</body>
</html>
